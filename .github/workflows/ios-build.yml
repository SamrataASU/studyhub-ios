name: iOS build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app and widgets for the iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project StudyHub.xcodeproj \
            -target StudyHub \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || true
          # Turn compiler errors into readable annotations on the run page
          grep -E ": error: " build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line#$GITHUB_WORKSPACE/}"
          done
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
